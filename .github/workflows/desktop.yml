name: desktop

# 桌面端 CI/CD（M3）：
#   - 普通 PR / push：只构建 + 打包版冒烟（不发布）
#   - 打后端版本 tag `v*`（与网页/后端一起发版；或手动触发勾选 publish）：
#     构建并把安装包追加到**同一个 Release** `v<版本>`，同时刷新滚动 Release
#     `desktop-latest`（**prerelease**，壳自更新读这里，见下方说明）
#
# 版本口径：桌面壳与后端/网页**同一个版本号**（desktop/package.json 的 0.1.3 ↔
# backend/app/__init__.py 的 V0.1.3），发布时 CI 会双向校验，不一致直接失败。
#
# 为什么壳更新用滚动 prerelease、而不是每个版本一个 Release：
#   壳与后端共用 Sustainedg/Coda 这个仓库。后端发版走 release.sh（tag v0.1.x，
#   资产是 coda.tar.gz），后端更新器读 `/releases/latest`；electron-updater 的
#   GitHub Provider 也认「最新 Release」，若壳的版本 Release 成了 latest，后端更新器
#   会去里面找 coda.tar.gz 落空，壳更新器也会去后端 Release 里找 latest.yml 落空。
#   所以壳这边统一上传到一个**滚动 tag**（desktop-latest，覆盖上传），且发布为
#   prerelease —— GitHub 的 `/releases/latest` 会跳过 prerelease，两边互不打扰。
#   壳的 Generic Provider 直接拼下载地址，与「latest」语义无关。
on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: '构建后发布到滚动 Release（desktop-latest）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与冒烟（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            args: --win --x64
            python: win-x64
            node: win-x64
          - os: macos-latest
            target: mac
            # 双架构放在**同一次** electron-builder 调用里：latest-mac.yml 才会合并
            # 两个架构的 zip（electron-builder 按同名 update-info 文件合并 files 列表），
            # 拆成两次调用的话后一次会把前一次的元数据覆盖掉。
            args: --mac --arm64 --x64
            python: both
            node: both
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      # 后端源码包要带 frontend/dist（prepare-backend 见它存在就不重建）
      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 安装桌面壳依赖
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: 下载 embedded Python（${{ matrix.target }}）
        working-directory: desktop
        shell: bash
        run: |
          if [ "${{ matrix.python }}" = "both" ]; then
            node scripts/fetch-python.mjs mac-arm64
            node scripts/fetch-python.mjs mac-x64
          else
            node scripts/fetch-python.mjs ${{ matrix.python }}
          fi

      # 方案 A：把后端依赖预装进内嵌解释器；方案 C：顺带下载离线 wheelhouse 兜底。
      # 用户机器上因此不再需要 pip / 联网 —— 首启直接用运行时。
      - name: 预装 Python 依赖（方案 A + C）
        working-directory: desktop
        shell: bash
        run: |
          if [ "${{ matrix.python }}" = "both" ]; then
            node scripts/prepare-python-deps.mjs mac-arm64
            node scripts/prepare-python-deps.mjs mac-x64
          else
            node scripts/prepare-python-deps.mjs ${{ matrix.python }}
          fi

      - name: 下载 embedded Node（${{ matrix.target }}）
        working-directory: desktop
        shell: bash
        run: |
          if [ "${{ matrix.node }}" = "both" ]; then
            node scripts/fetch-node.mjs mac-arm64
            node scripts/fetch-node.mjs mac-x64
          else
            node scripts/fetch-node.mjs ${{ matrix.node }}
          fi

      - name: 类型检查
        working-directory: desktop
        run: npm run typecheck

      # 内置 Python / Node 缺失时 electron-builder 只告警、照样出包，
      # 于是「能装能开、一装内核就报未找到命令 node」。这里按矩阵目标逐个核对。
      - name: 核对内嵌运行时
        working-directory: desktop
        shell: bash
        run: |
          if [ "${{ matrix.node }}" = "both" ]; then
            node scripts/check-runtimes.mjs mac-arm64 mac-x64
          else
            node scripts/check-runtimes.mjs ${{ matrix.node }}
          fi

      # electron-builder 直接读 dist-main/dist-preload；typecheck 是 --noEmit，
      # 漏掉这一步就会报「Application entry file dist-main/index.js does not exist」
      - name: 编译主进程
        working-directory: desktop
        run: npm run compile

      - name: 打包（electron-builder）
        working-directory: desktop
        shell: bash
        env:
          # 签名 / 公证凭据：仓库 Secrets 配了就自动启用，没配则产出 unsigned 包
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # secrets 未配置时 GitHub 仍会把变量设为空串。electron-builder 把空的
          # CSC_LINK 当成证书路径（解析成项目目录 → "not a file"），必须先清掉。
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "${APPLE_ID:-}" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          npx electron-builder ${{ matrix.args }} --publish never

      # 打包版冒烟：启动真实安装包（内嵌 Python 建 venv → 起后端 → 健康检查），
      # 就绪后主进程自行退出 0。这是「窗口层之外」的完整链路验证，无头 runner 可跑。
      - name: 冒烟启动（Windows）
        if: matrix.target == 'win'
        working-directory: desktop
        shell: pwsh
        timeout-minutes: 20
        run: |
          $env:CODA_DESKTOP_SMOKE = '1'
          $exe = Join-Path $PWD 'release/win-unpacked/Coda.exe'
          Write-Host "→ $exe"
          $p = Start-Process -FilePath $exe -PassThru -Wait `
            -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          Write-Host "--- stdout ---"; Get-Content smoke-out.txt -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"; Get-Content smoke-err.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "冒烟失败：退出码 $($p.ExitCode)" }

      - name: 冒烟启动（macOS）
        if: matrix.target == 'mac'
        working-directory: desktop
        shell: bash
        timeout-minutes: 20
        run: |
          APP="release/mac-arm64/Coda.app/Contents/MacOS/Coda"
          ls -l "$APP"
          CODA_DESKTOP_SMOKE=1 "$APP" 2>&1 | tee smoke.log
          test ${PIPESTATUS[0]} -eq 0

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.dmg
            desktop/release/latest*.yml
            desktop/release/*.blockmap

  publish:
    name: 发布到滚动 Release（desktop-latest）
    needs: build
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event.inputs.publish == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: 汇总构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: desktop-*
          merge-multiple: true

      - name: 读取并校验版本（桌面端 ↔ 后端）
        id: version
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          BACKEND_VERSION=$(grep -oP '(?<=^__version__ = ")[^"]+' backend/app/__init__.py)
          echo "桌面端：$VERSION · 后端：$BACKEND_VERSION"
          if [ "$BACKEND_VERSION" != "V$VERSION" ]; then
            echo "✗ 桌面端版本（$VERSION）与后端 $BACKEND_VERSION 不一致：两边必须同版本发布" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
              echo "✗ tag ${GITHUB_REF_NAME} 与版本 v$VERSION 不一致：先改版本号再打 tag" >&2
              exit 1
            fi
          fi

      - name: 发布（追加到 v<版本> Release + 刷新滚动 Release）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VTAG="v${{ steps.version.outputs.version }}"

          # 桌面安装包与网页/后端源码**同一个 Release**。Release 必须已由
          # scripts/release.sh 创建（里面才有 coda.tar.gz），这里只追加资产。
          if ! gh release view "$VTAG" >/dev/null 2>&1; then
            echo "✗ Release $VTAG 不存在：请先用 scripts/release.sh 发布后端/网页源码，再发桌面端" >&2
            exit 1
          fi
          ls -lh dist
          gh release upload "$VTAG" dist/* --clobber
          echo "✓ 已追加桌面安装包到 $VTAG"

          # 滚动 Release：壳自更新读这里（prerelease，不抢 /releases/latest）
          ROLLING=desktop-latest
          if ! gh release view "$ROLLING" >/dev/null 2>&1; then
            gh release create "$ROLLING" \
              --prerelease \
              --target "${{ github.sha }}" \
              --title "桌面端最新构建（滚动）" \
              --notes "由 CI 自动维护：桌面端安装包与 latest*.yml。请勿手动编辑，壳更新读取这里。"
          fi
          gh release upload "$ROLLING" dist/* --clobber
          echo "✓ 已刷新滚动 Release：$ROLLING"