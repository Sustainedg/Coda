appId: io.github.sustainedg.coda
productName: Coda
directories:
  output: release
  buildResources: build
# 产物名固定、无空格（electron-updater 按 latest*.yml 里的文件名下载，空格要额外转义）
# 例：Coda-0.2.0-win-x64.exe / Coda-0.2.0-mac-arm64.zip
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
files:
  # 壳本身：编译产物 + 静态资源 + 依赖（不含 src / 不带 devDependencies）
  - dist-main/**
  - dist-preload/**
  - resources/**
  - node_modules/**
  - package.json
  - "!**/*.map"
extraResources:
  # MIT 要求分发的副本里保留版权声明 → 随应用带一份（落到 resources/LICENSE.txt）。
  # 安装向导的「许可协议」页用的是同一份文件（nsis.license: ../LICENSE），不维护副本。
  - from: ../LICENSE
    to: LICENSE.txt
  # 后端源码包：构建时由 scripts/prepare-backend.mjs 组装（backend/ + frontend/dist/），
  # 安装后落在 resources/app-backend/，与主项目 coda.tar.gz 同构。
  # 排除清单与 scripts/release.sh 对齐：真实数据、venv、缓存、测试一律不进安装包
  - from: ../backend
    to: app-backend/backend
    filter:
      - "**/*"
      - "!data/**"
      - "!**/.venv/**"
      - "!**/__pycache__/"
      - "!**/__pycache__/**"
      - "!**/*.py[cod]"
      - "!.pytest_cache/**"
      - "!tests/**"
      - "!requirements-dev.txt"
      - "!conftest.py"
      - "!pytest.ini"
  - from: ../frontend/dist
    to: app-backend/frontend/dist
  # embedded Python：构建时由 scripts/fetch-python.mjs 下载 python-build-standalone
  # 按架构分目录（${arch}），mac 双架构在一次构建里各取各的解释器
  - from: build/python-runtime/${arch}
    to: python-runtime
  # embedded Node（M4）：scripts/fetch-node.mjs 下载官方 Node 发行包。
  # 内核（Claude Code / Codex / Gemini CLI）都是 npm 分发的 Node 程序，
  # 带上这一份，用户机器上就不需要预装 Node。
  - from: build/node-runtime/${arch}
    to: node-runtime
asarUnpack:
  # 无需解包的资源（保持默认）
  - "**/*.{node,dll}"
# Chromium 的界面语言包（locales/*.pak / *.lproj）：默认全量 55 种（~40MB）。
# 桌面端界面文案在应用层（后端 + 前端），Chromium 层只影响 DevTools / 右键菜单等
# 系统级 UI，中英两种足够。注意 mac 的目录名是下划线（zh_CN.lproj）而
# Linux / Windows 是连字符（zh-CN.pak），两种写法都带上才能全平台命中；
# 多余的名字匹配不到任何文件，无害。
electronLanguages: [en, en-US, en-GB, en_US, en_GB, zh-CN, zh_CN, zh-TW, zh_TW]
win:
  # 与网页图标同源（desktop/scripts/gen-icons.py 生成）
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # 签名：配置 CSC_LINK（.pfx 的 base64 / 路径）与 CSC_KEY_PASSWORD 后
  # electron-builder 自动签名；未配置时照常产出未签名安装包（MVP 可用，仅 SmartScreen 提示）
nsis:
  oneClick: false
  # 固定「仅当前用户」安装：向导里若允许再选安装范围，选择「所有用户」会触发 UAC
  # 二次启动 —— 第一个安装窗口关闭、提权后的新窗口从头再走一遍欢迎页与许可协议页，
  # 用户会误以为安装器重开了。这里用 installer-branding.nsh 的 customInstallMode
  # 直接强制当前用户（安装范围页被跳过），既避免重开，也保证安装目录对当前用户可写
  # —— 后者是 electron-updater 静默更新的前提（装到 Program Files 会需要提权、更新失败）。
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Coda
  # 卸载保留 userData：对话数据 / 内核安装都在那里，不能因为卸载应用就丢
  deleteAppDataOnUninstall: false
  # 差分更新（electron-updater 用 .blockmap 只下变化块）
  differentialPackage: true

  # ---- 品牌化（资源由 scripts/gen-installer-assets.py 生成，已入库） ----
  # 以下路径相对 buildResources（desktop/build）解析，写文件名即可
  # 左侧竖图：欢迎页 + 完成页共用（164×314，MUI 的硬性尺寸）
  installerSidebar: installerSidebar.bmp
  # 右上角横幅：其余向导页（150×57，MUI_HEADERIMAGE_RIGHT）
  installerHeader: installerHeader.bmp
  # 自定义页：补一页品牌欢迎页（默认向导没有 welcome page）
  # 不叫 installer.nsh：electron-builder 自带模板里已有同名文件，
  # 撞名后 !addincludedir 的搜索顺序一旦变化就会静默加载错文件。
  include: installer-branding.nsh
  # 许可协议页：单一权威来源是仓库根的 LICENSE（MIT），不在 desktop/ 再存一份副本。
  # 注意路径从 buildResources 解析不到时会回退到 projectDir（desktop/），
  # 所以 ../LICENSE 指向仓库根；纯 ASCII 文本，NSIS 的 Unicode 构建直接可读。
  license: ../LICENSE
  # 控制面板「应用和功能」里的显示名（默认是「Coda 0.1.3」带版本号）
  uninstallDisplayName: Coda
mac:
  icon: build/icon.icns
  target:
    # zip 是 macOS 自动更新的必需产物（Squirrel.Mac 只认 zip，DMG 仅供人工安装）
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  # 签名 / 公证：配置 CSC_LINK + CSC_KEY_PASSWORD 后自动签名；
  # 配置 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 后
  # scripts/notarize.cjs（afterSign 钩子）会自动公证。都没配时保持 unsigned 构建。
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 内嵌 Python / Node 的签名交给 afterPack 脚本：
  # electron-builder 会扫包内所有「看起来像二进制」的文件（内容启发式，可能把 .pyc 也算上），
  # 而我们是按 `file` 判定 Mach-O 再逐个签，避免误签数据文件、并统一套 runtime entitlements。
  signIgnore:
    - Contents/Resources/python-runtime
    - Contents/Resources/node-runtime
# 不要自定义 dmg.title：electron-builder 的默认卷名带架构后缀
# （Coda <版本>-arm64 / -x64）。自定义成 `Coda ${version}` 会让两个架构
# 抢同一个 /Volumes 卷名，第二个 DMG 构建挂载时 hdiutil detach 反复失败。
linux:
  # 桌面版只承诺 Win/macOS；linux 目标只是给服务器侧顺带构建，不作支持承诺
  icon: build/icon.png
  target: [AppImage]
  category: Utility
# 壳更新通道：**Generic Provider + 滚动 prerelease tag**，与后端 Release 完全隔离。
# 详见 src/main/updater.ts 顶部注释与 docs/说明/desktop.md。
# 发布时由 CI 把安装包 + latest*.yml 上传到 tag `desktop-latest`（必须标记 prerelease）。
publish:
  provider: generic
  url: https://github.com/Sustainedg/Coda/releases/download/desktop-latest
# 打包后先瘦身（Linux：strip 内嵌运行时二进制的调试段），再给内嵌 Python / Node 里的
# Mach-O 逐个签名（electron-builder 不扫 extraResources），再走正常签名流程，最后由
# afterSign 提交公证。两个钩子在无证书环境下都会跳过。
# 注意：electron-builder 的 afterPack 只接受单个函数，多个钩子由 pack-after-hooks.cjs 串联。
afterPack: scripts/pack-after-hooks.cjs
afterSign: scripts/notarize.cjs