<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 移动端是「固定外壳」的应用形态（顶栏 + 左侧抽屉 + 内部滚动），不随手指缩放：
         maximum-scale / user-scalable 管住 Android 系；iOS 会忽略它们，另有 touch-action 兜底（见 mobile.css）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Coda · 移动端</title>
    <meta name="description" content="Coda 移动端：在手机上查看智能体、网关与对话。" />
    <!-- theme-color 取顶栏背景叠在页面底色上的实际色（深色 #11101b），
         让 Android standalone 状态栏那一条和顶栏无缝衔接，不会出现色差断层。
         浅色由下面防闪脚本改成 #fefeff（浅色顶栏实际色）。 -->
    <meta name="theme-color" content="#11101b" />
    <link rel="manifest" href="/m/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 系统默认状态栏（非沉浸式）：状态栏是 iOS 自己画的一条（白底黑字 / 深色主题下黑底
         白字，背景色跟随下面的 theme-color），页面从状态栏正下方开始排 —— fixed 外壳贴的
         可视视口与它严丝合缝，顶部与底部都不会露缝、不需要任何视口补偿。
         曾经用 black-translucent（内容画到状态栏底下），但 iOS 26 独立应用在该模式下
         fixed / 可视视口比物理屏上下各矮一条状态栏，坐标系整体错位（顶部露画布、输入区
         按钮行掉进看不见的带里），多轮修复不可靠 —— 参照 LedgerArk 的稳妥做法换回 default。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Coda" />
    <meta name="format-detection" content="telephone=no" />
    <!-- 首屏防闪：样式生效前先把主题定下来（与 src/lib/theme.ts 同一套规则，保持极简、无依赖）。
         放在 head 末尾：它要读的 meta（theme-color）在前面，又早于任何样式与脚本。 -->
    <script>
      ;(function () {
        var mode = null
        try {
          mode = localStorage.getItem('coda.theme')
        } catch (error) {
          /* 隐私模式读不到存储：当成「没设置过」，下面按跟随系统处理 */
        }
        // 没设置过 = 跟随系统：只有显式选了深色才固定深色，其余看系统的深浅色。
        var light =
          mode === 'light' ||
          (mode !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
        if (!light) return
        var themeColor = document.querySelector('meta[name="theme-color"]')
        if (themeColor) themeColor.setAttribute('content', '#fefeff')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mobile/main.tsx"></script>
  </body>
</html>
